<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 385" role="img" aria-labelledby="title desc" lang="zh-Hant">
  <title id="title">寫檔與發布是兩個時點</title>
  <desc id="desc">目錄經表元數據、快照和清單找到 F1。已上傳的 F2 尚未發布，讀者看不到。</desc>
  <defs>
    <marker id="forward" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#305B7C"/></marker>
    <marker id="caution" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#9A5F18"/></marker>
  </defs>
  <g font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif">
    <rect x="1" y="1" width="862" height="383" rx="18" fill="#F3F7FA" stroke="#A5B7C6" stroke-width="2"/>
    <text x="32" y="34" fill="#315E83" font-size="14" font-weight="700" letter-spacing="1.1">01 / ICEBERG · 可見性</text>
    <text x="32" y="67" fill="#162C3C" font-size="27" font-weight="700">寫檔與發布是兩個時點</text>
    <text x="32" y="94" fill="#3C5569" font-size="16">讀者從表入口找版本，不從儲存路徑猜版本。</text>
    <path d="M32 111 H832" stroke="#B9C8D3"/>
    <path d="M204 180 H230" fill="none" stroke="#305B7C" stroke-width="2.25" marker-end="url(#forward)"/>
    <path d="M414 180 H440" fill="none" stroke="#305B7C" stroke-width="2.25" marker-end="url(#forward)"/>
    <path d="M596 273 H651 M594 264 V282" fill="none" stroke="#9A5F18" stroke-width="2" stroke-dasharray="5 4"/>
    <g transform="translate(32 136)">
      <rect width="172" height="88" rx="12" fill="#E1EEF9" stroke="#8AB1CF" stroke-width="1.2"/>
      <text x="14" y="23" fill="#174A75" font-size="12.5" font-weight="700" letter-spacing=".5">01 · CATALOG</text>
      <text x="14" y="49" fill="#172C3C" font-size="19" font-weight="700">目錄指標</text>
      <text x="14" y="73" fill="#334D61" font-size="14">目前表元數據 v1</text>
    </g>
    <g transform="translate(236 136)">
      <rect width="178" height="88" rx="12" fill="#E1EEF9" stroke="#8AB1CF" stroke-width="1.2"/>
      <text x="14" y="23" fill="#174A75" font-size="12.5" font-weight="700" letter-spacing=".5">02 · SNAPSHOT</text>
      <text x="14" y="49" fill="#172C3C" font-size="19" font-weight="700">快照 S1</text>
      <text x="14" y="73" fill="#334D61" font-size="14">沿資訊清單選檔</text>
    </g>
    <g transform="translate(446 136)">
      <rect width="172" height="88" rx="12" fill="#E0F3EE" stroke="#89C2B5" stroke-width="1.2"/>
      <text x="14" y="23" fill="#075D50" font-size="12.5" font-weight="700" letter-spacing=".5">03 · ACTIVE</text>
      <text x="14" y="49" fill="#172C3C" font-size="19" font-weight="700">可見檔 F1</text>
      <text x="14" y="73" fill="#334D61" font-size="14">查詢沿引用讀入</text>
    </g>
    <g transform="translate(660 234)">
      <rect width="172" height="77" rx="12" fill="#FFF1DD" stroke="#DCB77D" stroke-width="1.2"/>
      <text x="14" y="23" fill="#744507" font-size="12.5" font-weight="700" letter-spacing=".5">寫入端 · STAGED</text>
      <text x="14" y="49" fill="#172C3C" font-size="19" font-weight="700">未發布 F2</text>
      <text x="14" y="73" fill="#334D61" font-size="14">存在，尚不屬於表</text>
    </g>
    <path d="M32 330 H832" stroke="#B9C8D3"/>
    <text x="32" y="360" fill="#2D4860" font-size="15" font-weight="600">若發布完成，新指標會讓下一次讀取沿 S2 選檔；舊讀取仍按自己的版本。</text>
  </g>
</svg>
