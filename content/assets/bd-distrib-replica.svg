<svg xmlns="http://www.w3.org/2000/svg" width="820" height="411" viewBox="0 0 820 411" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">讀取切換</title><desc id="diagram-desc">區塊 A 的兩份內容相同。讀取區塊 A，先查可用位置；補複本，恢復安全餘裕。東機架 · 節點 1，複本 A · 掉線，hot；西機架 · 節點 2，複本 A · 仍可讀；新位置，待補的複本 A。讀得回與補到目標份數，是兩個不同時點。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#2b668b"/></marker><marker id="hot" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a65416"/></marker></defs>
<rect x="1" y="1" width="818" height="409" rx="16" fill="#fff" stroke="#dce5eb"/>
<g font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif">
<text x="30" y="40" font-size="24" font-weight="700" fill="#172d3d">讀取切換</text>
<text x="30" y="66" font-size="15" fill="#4b6171">區塊 A 的兩份內容相同</text>
<path d="M30 81H790" stroke="#dce5eb"/>
<rect x="30" y="138" width="248" height="58" rx="10" fill="#f6fafc" stroke="#a8c2d3"/><text x="44" y="162" font-size="16" font-weight="700" fill="#14374e">讀取區塊 A</text><text x="44" y="183" font-size="14" fill="#465868">先查可用位置</text>
<rect x="30" y="216" width="248" height="58" rx="10" fill="#f6fafc" stroke="#a8c2d3"/><text x="44" y="240" font-size="16" font-weight="700" fill="#14374e">補複本</text><text x="44" y="261" font-size="14" fill="#465868">恢復安全餘裕</text>
<rect x="542" y="99" width="248" height="58" rx="10" fill="#fff4e8" stroke="#d9b28c"/><text x="556" y="123" font-size="16" font-weight="700" fill="#823e0b">東機架 · 節點 1</text><text x="556" y="144" font-size="14" fill="#465868">複本 A · 掉線</text>
<rect x="542" y="177" width="248" height="58" rx="10" fill="#f6fafc" stroke="#a8c2d3"/><text x="556" y="201" font-size="16" font-weight="700" fill="#14374e">西機架 · 節點 2</text><text x="556" y="222" font-size="14" fill="#465868">複本 A · 仍可讀</text>
<rect x="542" y="255" width="248" height="58" rx="10" fill="#f6fafc" stroke="#a8c2d3"/><text x="556" y="279" font-size="16" font-weight="700" fill="#14374e">新位置</text><text x="556" y="300" font-size="14" fill="#465868">待補的複本 A</text>
<path d="M283 167 C383 167 437 128 536 128" fill="none" stroke="#a65416" stroke-width="1.8" marker-end="url(#hot)"/><text x="409" y="142.5" text-anchor="middle" fill="#23485d" stroke="white" stroke-width="5" paint-order="stroke" font-size="14">第一次</text>
<path d="M283 167 C383 167 437 206 536 206" fill="none" stroke="#2b668b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="409" y="181.5" text-anchor="middle" fill="#23485d" stroke="white" stroke-width="5" paint-order="stroke" font-size="14">改讀</text>
<path d="M283 245 C383 245 437 284 536 284" fill="none" stroke="#2b668b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="409" y="259.5" text-anchor="middle" fill="#23485d" stroke="white" stroke-width="5" paint-order="stroke" font-size="14">從健康複本重建</text>
<rect x="30" y="343" width="760" height="38" rx="8" fill="#edf5f9"/>
<text x="46" y="367" font-size="14" fill="#254a62">讀得回與補到目標份數，是兩個不同時點。</text>
</g></svg>
