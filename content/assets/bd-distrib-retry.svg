<svg xmlns="http://www.w3.org/2000/svg" width="820" height="333" viewBox="0 0 820 333" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">兩次嘗試，一次業務效果</title><desc id="diagram-desc">回報中斷後，同批事件可能重放。嘗試 1，r-01 已寫入；嘗試 2，r-01 重送。正式輸出，r-01 · 只出現一次。不要以每次嘗試的新編號去重；認原始事件的穩定鍵。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#2b668b"/></marker><marker id="hot" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a65416"/></marker></defs>
<rect x="1" y="1" width="818" height="331" rx="16" fill="#fff" stroke="#dce5eb"/>
<g font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif">
<text x="30" y="40" font-size="24" font-weight="700" fill="#172d3d">兩次嘗試，一次業務效果</text>
<text x="30" y="66" font-size="15" fill="#4b6171">回報中斷後，同批事件可能重放</text>
<path d="M30 81H790" stroke="#dce5eb"/>
<rect x="30" y="99" width="248" height="58" rx="10" fill="#f6fafc" stroke="#a8c2d3"/><text x="44" y="123" font-size="16" font-weight="700" fill="#14374e">嘗試 1</text><text x="44" y="144" font-size="14" fill="#465868">r-01 已寫入</text>
<rect x="30" y="177" width="248" height="58" rx="10" fill="#f6fafc" stroke="#a8c2d3"/><text x="44" y="201" font-size="16" font-weight="700" fill="#14374e">嘗試 2</text><text x="44" y="222" font-size="14" fill="#465868">r-01 重送</text>
<rect x="542" y="138" width="248" height="58" rx="10" fill="#f6fafc" stroke="#a8c2d3"/><text x="556" y="162" font-size="16" font-weight="700" fill="#14374e">正式輸出</text><text x="556" y="183" font-size="14" fill="#465868">r-01 · 只出現一次</text>
<path d="M283 128 C383 128 437 167 536 167" fill="none" stroke="#2b668b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="409" y="142.5" text-anchor="middle" fill="#23485d" stroke="white" stroke-width="5" paint-order="stroke" font-size="14">首次提交</text>
<path d="M283 206 C383 206 437 167 536 167" fill="none" stroke="#2b668b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="409" y="181.5" text-anchor="middle" fill="#23485d" stroke="white" stroke-width="5" paint-order="stroke" font-size="14">比對同鍵</text>
<rect x="30" y="265" width="760" height="38" rx="8" fill="#edf5f9"/>
<text x="46" y="289" font-size="14" fill="#254a62">不要以每次嘗試的新編號去重；認原始事件的穩定鍵。</text>
</g></svg>
