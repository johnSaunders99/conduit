<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 385" role="img" aria-labelledby="title desc" lang="zh-Hant">
  <title id="title">複本保護日誌，寫端保護業務</title>
  <desc id="desc">生產者送到分區領導者並由同步複本確認。消費者再連向外部表，該表需要自己的去重。</desc>
  <defs>
    <marker id="forward" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#305B7C"/></marker>
    <marker id="caution" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#9A5F18"/></marker>
  </defs>
  <g font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif">
    <rect x="1" y="1" width="862" height="383" rx="18" fill="#F3F7FA" stroke="#A5B7C6" stroke-width="2"/>
    <text x="32" y="34" fill="#315E83" font-size="14" font-weight="700" letter-spacing="1.1">04 / KAFKA · 交付邊界</text>
    <text x="32" y="67" fill="#162C3C" font-size="27" font-weight="700">複本保護日誌，寫端保護業務</text>
    <text x="32" y="94" fill="#3C5569" font-size="16">寫入確認、消費進度和外部表交易，是三種不同的證據。</text>
    <path d="M32 111 H832" stroke="#B9C8D3"/>
    <path d="M207 182 H233" fill="none" stroke="#305B7C" stroke-width="2.25" marker-end="url(#forward)"/>
    <path d="M426 182 H452" fill="none" stroke="#305B7C" stroke-width="2.25" marker-end="url(#forward)"/>
    <path d="M631 182 H657" fill="none" stroke="#305B7C" stroke-width="2.25" marker-end="url(#forward)"/>
    <path d="M332 226 V236" fill="none" stroke="#305B7C" stroke-width="2.25" marker-end="url(#forward)"/>
    <g transform="translate(32 138)">
      <rect width="175" height="88" rx="12" fill="#E1EEF9" stroke="#8AB1CF" stroke-width="1.2"/>
      <text x="14" y="23" fill="#174A75" font-size="12.5" font-weight="700" letter-spacing=".5">01 · PRODUCER</text>
      <text x="14" y="49" fill="#172C3C" font-size="19" font-weight="700">送出訊息</text>
      <text x="14" y="73" fill="#334D61" font-size="14">生產重試可用冪等</text>
    </g>
    <g transform="translate(239 138)">
      <rect width="187" height="88" rx="12" fill="#E1EEF9" stroke="#8AB1CF" stroke-width="1.2"/>
      <text x="14" y="23" fill="#174A75" font-size="12.5" font-weight="700" letter-spacing=".5">02 · PARTITION</text>
      <text x="14" y="49" fill="#172C3C" font-size="19" font-weight="700">分區領導者</text>
      <text x="14" y="73" fill="#334D61" font-size="14">按位移排列日誌</text>
    </g>
    <g transform="translate(458 138)">
      <rect width="173" height="88" rx="12" fill="#E0F3EE" stroke="#89C2B5" stroke-width="1.2"/>
      <text x="14" y="23" fill="#075D50" font-size="12.5" font-weight="700" letter-spacing=".5">03 · CONSUMER</text>
      <text x="14" y="49" fill="#172C3C" font-size="19" font-weight="700">消費者</text>
      <text x="14" y="73" fill="#334D61" font-size="14">從提交進度續讀</text>
    </g>
    <g transform="translate(663 138)">
      <rect width="169" height="88" rx="12" fill="#FFF1DD" stroke="#DCB77D" stroke-width="1.2"/>
      <text x="14" y="23" fill="#744507" font-size="12.5" font-weight="700" letter-spacing=".5">04 · SINK</text>
      <text x="14" y="49" fill="#172C3C" font-size="19" font-weight="700">外部表</text>
      <text x="14" y="73" fill="#334D61" font-size="14">自行核對業務鍵</text>
    </g>
    <g transform="translate(239 242)">
      <rect width="187" height="77" rx="12" fill="#F0EAFB" stroke="#B5A3D7" stroke-width="1.2"/>
      <text x="14" y="23" fill="#543680" font-size="12.5" font-weight="700" letter-spacing=".5">ISR · ACKS</text>
      <text x="14" y="49" fill="#172C3C" font-size="19" font-weight="700">同步複本</text>
      <text x="14" y="73" fill="#334D61" font-size="14">確認條件不跨外部表</text>
    </g>
    <path d="M32 330 H832" stroke="#B9C8D3"/>
    <text x="32" y="360" fill="#2D4860" font-size="15" font-weight="600">外部表已寫、位移未提就停機 → 可能重讀，不應再次扣款。</text>
  </g>
</svg>
