<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 274" role="img" aria-labelledby="title desc">
<title id="title">確認等同步複本，不等所有指派複本</title><desc id="desc">RF 為 3、最低 ISR 為 2。領導複本和 F1 同步，F2 落後不在 ISR，acks=all 可等兩份確認。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#52708a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="1" y="1" width="818" height="272" rx="18" fill="#f3f7fa" stroke="#d4e0eb"/>
<g font-family="'Microsoft JhengHei UI','Noto Sans TC',system-ui,sans-serif">
<text x="26" y="33" fill="#1d5c8f" font-size="13" font-weight="700" font-family="Consolas, monospace">KAFKA / 03</text>
<text x="26" y="61" fill="#162d42" font-size="25" font-weight="700">確認等同步複本，不等所有指派複本</text>
<path d="M26 77H794" fill="none" stroke="#d4e0eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="26" y="101" width="135" height="53" rx="10" fill="#fff" stroke="#d4e0eb"/>
<text x="93" y="134" fill="#162d42" font-size="18" font-weight="700" text-anchor="middle">生產者</text>
<path d="M163 128H216" fill="none" stroke="#1d5c8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="219" y="95" width="207" height="65" rx="10" fill="#e5f0fb" stroke="#d4e0eb"/>
<text x="235" y="120" fill="#162d42" font-size="18" font-weight="700">領導複本 L</text>
<text x="235" y="144" fill="#1d5c8f" font-size="16">在 ISR</text>
<path d="M426 126H556" fill="none" stroke="#1d5c8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="558" y="95" width="230" height="65" rx="10" fill="#e2f4ef" stroke="#d4e0eb"/>
<text x="574" y="120" fill="#162d42" font-size="18" font-weight="700">追隨複本 F1</text>
<text x="574" y="144" fill="#0a6b63" font-size="16">在 ISR</text>
<path d="M426 140H503V197H556" fill="none" stroke="#8b460c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<rect x="558" y="172" width="230" height="53" rx="10" fill="#fff1de" stroke="#d4e0eb"/>
<text x="574" y="204" fill="#8b460c" font-size="18" font-weight="700">F2 落後，不在 ISR</text>
<rect x="26" y="179" width="457" height="46" rx="10" fill="#fff" stroke="#d4e0eb"/>
<text x="42" y="208" fill="#36546e" font-size="17" font-weight="700">RF = 3　／　ISR = 2　／　最低 ISR = 2</text>
<text x="26" y="254" fill="#36546e" font-size="16">acks=all 等 L 和 F1；若只剩 L 在 ISR，新寫入不能確認成功。</text>
</g></svg>
