<svg xmlns="http://www.w3.org/2000/svg" width="820" height="333" viewBox="0 0 820 333" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">連接的兩種搬運成本</title><desc id="diagram-desc">同一個等值 JOIN，不同實體路徑。小維表 + 大事實表，大側留在原分區；兩側都大，鍵可排序。Broadcast Hash Join，複製小側，查雜湊表；Sort-Merge Join，相容分佈及排序後合併。先對帳列數與配對粒度，再把時間差歸因給連接策略。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#2b668b"/></marker><marker id="hot" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a65416"/></marker></defs>
<rect x="1" y="1" width="818" height="331" rx="16" fill="#fff" stroke="#dce5eb"/>
<g font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif">
<text x="30" y="40" font-size="24" font-weight="700" fill="#172d3d">連接的兩種搬運成本</text>
<text x="30" y="66" font-size="15" fill="#4b6171">同一個等值 JOIN，不同實體路徑</text>
<path d="M30 81H790" stroke="#dce5eb"/>
<rect x="30" y="99" width="248" height="58" rx="10" fill="#f6fafc" stroke="#a8c2d3"/><text x="44" y="123" font-size="16" font-weight="700" fill="#14374e">小維表 + 大事實表</text><text x="44" y="144" font-size="14" fill="#465868">大側留在原分區</text>
<rect x="30" y="177" width="248" height="58" rx="10" fill="#f6fafc" stroke="#a8c2d3"/><text x="44" y="201" font-size="16" font-weight="700" fill="#14374e">兩側都大</text><text x="44" y="222" font-size="14" fill="#465868">鍵可排序</text>
<rect x="542" y="99" width="248" height="58" rx="10" fill="#f6fafc" stroke="#a8c2d3"/><text x="556" y="123" font-size="16" font-weight="700" fill="#14374e">Broadcast Hash Join</text><text x="556" y="144" font-size="14" fill="#465868">複製小側，查雜湊表</text>
<rect x="542" y="177" width="248" height="58" rx="10" fill="#f6fafc" stroke="#a8c2d3"/><text x="556" y="201" font-size="16" font-weight="700" fill="#14374e">Sort-Merge Join</text><text x="556" y="222" font-size="14" fill="#465868">相容分佈及排序後合併</text>
<path d="M283 128 C383 128 437 128 536 128" fill="none" stroke="#2b668b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="409" y="120" text-anchor="middle" fill="#23485d" stroke="white" stroke-width="5" paint-order="stroke" font-size="14">廣播小側</text>
<path d="M283 206 C383 206 437 206 536 206" fill="none" stroke="#2b668b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="409" y="198" text-anchor="middle" fill="#23485d" stroke="white" stroke-width="5" paint-order="stroke" font-size="14">必要時先交換</text>
<rect x="30" y="265" width="760" height="38" rx="8" fill="#edf5f9"/>
<text x="46" y="289" font-size="14" fill="#254a62">先對帳列數與配對粒度，再把時間差歸因給連接策略。</text>
</g></svg>
