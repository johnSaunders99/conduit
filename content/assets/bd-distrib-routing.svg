<svg xmlns="http://www.w3.org/2000/svg" width="820" height="411" viewBox="0 0 820 411" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">同鍵合流</title><desc id="diagram-desc">固定分區數 3 · 以餘數分派。會員 3、6，各有 1 筆；會員 7 與會員 4，4 筆 + 1 筆；會員 2，1 筆。分區 0，2 筆；分區 1，5 筆 · 最大；分區 2，1 筆。不同會員可以共用分區；同一會員在本次映射中不分開。</desc>
