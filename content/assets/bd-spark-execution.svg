<svg xmlns="http://www.w3.org/2000/svg" width="820" height="333" viewBox="0 0 820 333" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">本機的協調與執行</title><desc id="diagram-desc">local[2] · 一台機器，最多兩個工作槽。PySpark 程式，建立 SparkSession；Driver，安排計畫與任務。提交計算需求，Driver 決定怎麼跑；本機兩個工作槽，逐批處理多個分區。Jobs、Stages 和 Tasks 是工作層級，不等於電腦台數。</desc>
