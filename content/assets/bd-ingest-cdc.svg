<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 308" role="img" aria-labelledby="title description">
  <title id="title">刪除也是一筆有位置的事件</title>
  <desc id="description">先讀快照，再按來源位置依序套用新增、更新與刪除，目的端提交後才推進。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#356684"/></marker>
  </defs>
  <rect x="1" y="1" width="758" height="306" rx="18" fill="#f3f7fa" stroke="#ccd9e4" stroke-width="2"/>
  <g font-family="Microsoft JhengHei, PingFang TC, sans-serif">
    <text x="32" y="38" font-size="23" font-weight="700" fill="#17334b">刪除也是一筆有位置的事件</text>
    <path d="M175 140 H207" fill="none" stroke="#356684" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M354 140 H385" fill="none" stroke="#356684" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M531 140 H562" fill="none" stroke="#356684" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(33 108)">
      <rect width="142" height="64" rx="9" fill="#ffffff" stroke="#8eaec5"/>
      <text x="71" y="26" text-anchor="middle" font-size="19" font-weight="650" fill="#163650">快照</text>
      <text x="71" y="49" text-anchor="middle" font-size="15" fill="#36566a">建立基線</text>
    </g>
    <g transform="translate(215 108)">
      <rect width="139" height="64" rx="9" fill="#ffffff" stroke="#8eaec5"/>
      <text x="69.5" y="26" text-anchor="middle" font-size="19" font-weight="650" fill="#163650">位置 1</text>
      <text x="69.5" y="49" text-anchor="middle" font-size="15" fill="#36566a">新增訂單</text>
    </g>
    <g transform="translate(393 108)">
      <rect width="138" height="64" rx="9" fill="#ffffff" stroke="#8eaec5"/>
      <text x="69" y="26" text-anchor="middle" font-size="19" font-weight="650" fill="#163650">位置 2</text>
      <text x="69" y="49" text-anchor="middle" font-size="15" fill="#36566a">更新金額</text>
    </g>
    <g transform="translate(570 108)">
      <rect width="155" height="64" rx="9" fill="#fff1df" stroke="#ba8646"/>
      <text x="77.5" y="26" text-anchor="middle" font-size="19" font-weight="650" fill="#163650">位置 3</text>
      <text x="77.5" y="49" text-anchor="middle" font-size="15" fill="#36566a">刪除訂單</text>
    </g>
    <path d="M32 267H728" stroke="#c3d3de"/>
    <text x="32" y="291" font-size="16" fill="#36566a">寫端提交後更新進度；復原可從已保存位置安全重播。</text>
  </g>
</svg>
