<svg xmlns="http://www.w3.org/2000/svg" width="820" height="411" viewBox="0 0 820 411" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">先選日期目錄，再讀列</title><desc id="diagram-desc">條件：dt = 2026-01-02。掃描器，先檢查分區欄。dt=2026-01-01，不選取，mute；dt=2026-01-02，讀這個日期；dt=2026-01-03，不選取，mute。只有金額條件一般不能排除日期目錄；需查分區的明確條件。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#2b668b"/></marker><marker id="hot" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a65416"/></marker></defs>
<rect x="1" y="1" width="818" height="409" rx="16" fill="#fff" stroke="#dce5eb"/>
<g font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif">
<text x="30" y="40" font-size="24" font-weight="700" fill="#172d3d">先選日期目錄，再讀列</text>
<text x="30" y="66" font-size="15" fill="#4b6171">條件：dt = 2026-01-02</text>
<path d="M30 81H790" stroke="#dce5eb"/>
<rect x="30" y="177" width="248" height="58" rx="10" fill="#f6fafc" stroke="#a8c2d3"/><text x="44" y="201" font-size="16" font-weight="700" fill="#14374e">掃描器</text><text x="44" y="222" font-size="14" fill="#465868">先檢查分區欄</text>
<rect x="542" y="99" width="248" height="58" rx="10" fill="#f1f3f5" stroke="#c9d1d9"/><text x="556" y="123" font-size="16" font-weight="700" fill="#505e69">dt=2026-01-01</text><text x="556" y="144" font-size="14" fill="#465868">不選取</text>
<rect x="542" y="177" width="248" height="58" rx="10" fill="#f6fafc" stroke="#a8c2d3"/><text x="556" y="201" font-size="16" font-weight="700" fill="#14374e">dt=2026-01-02</text><text x="556" y="222" font-size="14" fill="#465868">讀這個日期</text>
<rect x="542" y="255" width="248" height="58" rx="10" fill="#f1f3f5" stroke="#c9d1d9"/><text x="556" y="279" font-size="16" font-weight="700" fill="#505e69">dt=2026-01-03</text><text x="556" y="300" font-size="14" fill="#465868">不選取</text>
<path d="M283 206 C383 206 437 206 536 206" fill="none" stroke="#2b668b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="409" y="198" text-anchor="middle" fill="#23485d" stroke="white" stroke-width="5" paint-order="stroke" font-size="14">命中目錄</text>
<rect x="30" y="343" width="760" height="38" rx="8" fill="#edf5f9"/>
<text x="46" y="367" font-size="14" fill="#254a62">只有金額條件一般不能排除日期目錄；需查分區的明確條件。</text>
</g></svg>
