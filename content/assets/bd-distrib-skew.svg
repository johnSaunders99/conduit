<svg xmlns="http://www.w3.org/2000/svg" width="820" height="489" viewBox="0 0 820 489" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">拆熱鍵再合回</title><desc id="diagram-desc">鍵 7 的 80 列分成四份。鍵 7 · 80 列，用列級識別碼決定鹽值，hot。鹽 0，20 列；鹽 1，20 列；鹽 2，20 列；鹽 3，20 列。第二階段移除鹽值，按原鍵加總：20 + 20 + 20 + 20 = 80。</desc>
